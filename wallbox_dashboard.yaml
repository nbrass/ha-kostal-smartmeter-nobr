# KOSTAL Plenticore + Enector Wallbox Energy Dashboard
# Paste this into: Settings → Dashboards → Edit (pencil) → ⋮ → Raw config editor

views:
  - title: Energie & Wallbox
    icon: mdi:lightning-bolt
    path: energy
    cards:
      - type: horizontal-stack
        title: "⚡ Live Energiefluss"
        cards:
          - type: entity
            entity: sensor.scb_solar_power
            name: "☀️ Solar"
          - type: entity
            entity: sensor.scb_home_power
            name: "🏠 Verbrauch"
          - type: entity
            entity: sensor.scb_grid_power
            name: "🔌 Netz"

      - type: horizontal-stack
        title: "🔋 Batterie & Auto"
        cards:
          - type: entity
            entity: sensor.scb_pv_to_battery_power
            name: "PV→Batterie"
          - type: entity
            entity: sensor.wallbox_enector_ladeleistung
            name: "Auto lädt"

      - type: horizontal-stack
        title: "🚗 Wallbox Steuerung"
        cards:
          - type: entity
            entity: sensor.wallbox_enector_status
            name: Status
          - type: entity
            entity: select.wallbox_charge_mode
            name: Modus

      - type: horizontal-stack
        cards:
          - type: entity
            entity: switch.wallbox_pause_charging
            name: Laden pausieren
          - type: entity
            entity: switch.wallbox_battery_usage_bei_pv
            name: Batterie nutzen

      - type: entities
        title: "📊 Heutige Energien"
        entities:
          - entity: sensor.scb_energy_yield_day
            name: "☀️ Solar Ertrag heute"
          - entity: sensor.scb_home_consumption_day
            name: "🏠 Verbrauch heute"
          - entity: sensor.scb_energy_to_grid_day
            name: "↗️ Ins Netz heute"
          - entity: sensor.scb_home_consumption_from_pv_day
            name: "  ├─ aus Solar"
          - entity: sensor.scb_home_consumption_from_battery_day
            name: "  ├─ aus Batterie"
          - entity: sensor.scb_home_consumption_from_grid_day
            name: "  └─ aus Netz"
          - entity: sensor.wallbox_enector_geladene_energie
            name: "🚗 Auto geladen (Session)"


      - type: entities
        title: "📅 Jahresstatistik"
        entities:
          - entity: sensor.scb_energy_yield_year
            name: "☀️ Solar Ertrag Jahr"
          - entity: sensor.scb_home_consumption_year
            name: "🏠 Verbrauch Jahr"
          - entity: sensor.scb_energy_to_grid_year
            name: "↗️ Ins Netz Jahr"
          - entity: sensor.scb_own_consumption_rate_year
            name: "📈 Eigenverbrauchsquote Jahr"

      - type: entities
        title: "🔧 Wallbox Details"
        entities:
          - entity: sensor.enector_charging_l1
            name: Strom L1
          - entity: sensor.enector_charging_l2
            name: Strom L2
          - entity: sensor.enector_charging_l3
            name: Strom L3
          - entity: sensor.wallbox_enector_ladeleistung
            name: Ladeleistung (Total)
          - entity: sensor.wallbox_verfugbare_ladeleistung
            name: Verfügbare Leistung
          - entity: select.wallbox_phasenumschaltung
            name: Phasen
          - entity: number.wallbox_min_pv_power
            name: Min PV Power %
          - entity: number.wallbox_min_charging_power
            name: Min Charging Power %
