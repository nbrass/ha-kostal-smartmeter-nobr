# KOSTAL KSEM Wallbox & Energieflow Dashboard — Built-in cards only
# Paste this into: Settings → Dashboards → Edit (pencil) → ⋮ → Raw config editor

views:
  - title: Wallbox & Energiefluss
    icon: mdi:ev-charging
    path: wallbox
    cards:
      - type: heading
        heading: "Wallbox Status"

      - type: horizontal-stack
        cards:
          - type: entity
            entity: sensor.controlroom_wallbox_enector_status
            name: Status
          - type: entity
            entity: sensor.controlroom_wallbox_enector_ladeleistung
            name: Ladeleistung (W)

      - type: heading
        heading: "⚙️ Steuerung"

      - type: horizontal-stack
        cards:
          - type: entity
            entity: select.controlroom_wallbox_charge_mode
            name: Lademodus
          - type: entity
            entity: select.controlroom_wallbox_phasenumschaltung
            name: Phasen

      - type: horizontal-stack
        cards:
          - type: entity
            entity: number.controlroom_wallbox_min_pv_power
            name: Min PV Power %
          - type: entity
            entity: number.controlroom_wallbox_min_charging_power
            name: Min Charging Power %

      - type: entity
        entity: switch.controlroom_wallbox_pause_charging
        name: Laden pausieren

      - type: heading
        heading: "⚡ Energiefluss (Live)"

      - type: entities
        title: Netzstrom
        entities:
          - entity: sensor.controlroom_grid_power_total
            name: Netz (+ Import / − Export) [W]
          - entity: sensor.controlroom_sum_pv_power_inverter_dc
            name: PV Anlage [W]
          - entity: sensor.controlroom_home_consumption
            name: Hausverbrauch [W]

      - type: entities
        title: Batterie & Wallbox
        entities:
          - entity: sensor.controlroom_system_state_of_charge
            name: Batterie SoC [%]
          - entity: sensor.controlroom_sum_battery_charge_discharge_dc
            name: Batterie Laden/Entladen [W]
          - entity: sensor.controlroom_sum_wallbox_charge_power_total
            name: "Wallbox Gesamtleistung [W]"
          - entity: sensor.controlroom_sum_wallbox_charge_power_pv
            name: "  ├─ aus PV [W]"
          - entity: sensor.controlroom_sum_wallbox_charge_power_battery
            name: "  ├─ aus Batterie [W]"
          - entity: sensor.controlroom_sum_wallbox_charge_power_grid
            name: "  └─ aus Netz [W]"

      - type: heading
        heading: "Wallbox Sensoren"

      - type: entities
        entities:
          - entity: sensor.controlroom_wallbox_enector_status
            name: Wallbox Status
          - entity: sensor.controlroom_wallbox_enector_l1
            name: Strom L1 [A]
          - entity: sensor.controlroom_wallbox_enector_ladeleistung
            name: Ladeleistung [W]
          - entity: sensor.controlroom_wallbox_enector_geladene_energie
            name: "Diese Session [Wh]"
          - entity: sensor.controlroom_wallbox_verfügbare_ladeleistung
            name: Verfügbare Leistung [W]

      - type: heading
        heading: "🔍 Smartmeter Diagnose"

      - type: entities
        title: System Health
        entities:
          - entity: sensor.controlroom_cpu_load
            name: CPU Last [%]
          - entity: sensor.controlroom_cpu_temperature
            name: CPU Temperatur [°C]
          - entity: sensor.controlroom_ram_free
            name: RAM frei [kB]
          - entity: sensor.controlroom_flash_app_free
            name: Flash (App) frei [B]
